<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/normalize.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <title>Форма</title>
</head>

<body>
  <form class="form">
    <fieldset class="form-group">
      <legend class="form-group-title">Ваши личные данные</legend>

      <label class="label" for="name">Ваше имя</label>
      <input class="input" type="text" name="name" placeholder="Имя" required>

      <label class="label" for="age">Ваш возраст</label>
      <input class="input" type="number" name="age" placeholder="Возраст" required>

      <label class="label" for="phone">Ваш номер телефона</label>
      <input class="input" type="tel" name="phone" placeholder="Номер телефона" required>

      <label class="label" for="mail">Ваша почта</label>
      <input class="input" type="email" name="mail" placeholder="Почта" required>

    </fieldset>

    <fieldset class="form-group">

      <label class="label" class="" for="massage">Сообщение</label>
      <textarea class="textarea" name="massage" id="massage" placeholder="Ваше сообщение" required></textarea>
      <label for="label" class="label checkbox-label">
        <input class="checkbox" type="checkbox" name="checkbox" required>
        <span class="checkbox-text">Я принимаю правила</span>
      </label>
    </fieldset>
    <button class="button" type="submit">Отправить</button>
  </form>
</body>

</html>
